<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="456" viewBox="0 0 680 310" role="img"><title>Инкрементальная сборка</title><desc>Изменение foo.c вызывает пересборку foo.o и повторную линковку app. main.o сохраняется.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#94a3b8"/></marker><marker id="active" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#f5bd77"/></marker></defs><rect x="0" y="0" width="680" height="310" rx="12" fill="#18212e"/><rect x="54" y="20" width="234" height="52" rx="8" fill="#222e3e" stroke="#94a3b8" stroke-width="1.4"/><text x="171.0" y="44.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">main.c</text><text x="171.0" y="65.0" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">без изменений</text><rect x="392" y="20" width="234" height="52" rx="8" fill="#382e27" stroke="#f5bd77" stroke-width="1.4"/><text x="509.0" y="44.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">foo.c</text><text x="509.0" y="65.0" fill="#f5bd77" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">изменён</text><path d="M171 72 V115" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M509 72 V115" fill="none" stroke="#f5bd77" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#active)"/><rect x="54" y="116" width="234" height="52" rx="8" fill="#222e3e" stroke="#94a3b8" stroke-width="1.4"/><text x="171.0" y="140.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">main.o</text><text x="171.0" y="161.0" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">актуален</text><rect x="392" y="116" width="234" height="52" rx="8" fill="#382e27" stroke="#f5bd77" stroke-width="1.4"/><text x="509.0" y="140.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">foo.o</text><text x="509.0" y="161.0" fill="#f5bd77" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">перекомпилируется</text><path d="M171 168 V202 H296 V226" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M509 168 V202 H384 V226" fill="none" stroke="#f5bd77" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#active)"/><rect x="224" y="227" width="232" height="52" rx="8" fill="#382e27" stroke="#f5bd77" stroke-width="1.4"/><text x="340.0" y="251.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">app</text><text x="340.0" y="272.0" fill="#f5bd77" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">повторная линковка</text><text x="340" y="298" fill="#b3c1d0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">Стрелки: из каких файлов создаётся результат</text></svg>