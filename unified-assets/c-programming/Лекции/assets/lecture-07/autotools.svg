<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="521" viewBox="0 0 680 354" role="img"><title>Autotools</title><desc>Разработчик пишет configure.ac и Makefile.am. Autoconf и Automake генерируют configure и Makefile.in. На машине пользователя configure создаёт Makefile и config.h.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#94a3b8"/></marker><marker id="active" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#f5bd77"/></marker></defs><rect x="0" y="0" width="680" height="354" rx="12" fill="#18212e"/><text x="340" y="24" fill="#b3c1d0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Разработчик проекта</text><rect x="44" y="40" width="250" height="44" rx="8" fill="#222e3e" stroke="#94a3b8" stroke-width="1.4"/><text x="169.0" y="68.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">configure.ac</text><rect x="386" y="40" width="250" height="44" rx="8" fill="#222e3e" stroke="#94a3b8" stroke-width="1.4"/><text x="511.0" y="68.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">Makefile.am</text><path d="M169 84 V125" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M511 84 V125" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="181" y="108" fill="#76d9b4" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">autoconf</text><text x="523" y="108" fill="#76d9b4" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">automake</text><rect x="44" y="126" width="250" height="44" rx="8" fill="#222e3e" stroke="#94a3b8" stroke-width="1.4"/><text x="169.0" y="154.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">configure</text><rect x="386" y="126" width="250" height="44" rx="8" fill="#222e3e" stroke="#94a3b8" stroke-width="1.4"/><text x="511.0" y="154.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">Makefile.in</text><path d="M22 187 H658" stroke="#94a3b8" stroke-dasharray="5 5" opacity=".6"/><text x="340" y="207" fill="#b3c1d0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Компьютер пользователя</text><path d="M169 170 V218 H244 V236" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M511 170 V218 H436 V236" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="234" y="237" width="212" height="44" rx="8" fill="#222e3e" stroke="#94a3b8" stroke-width="1.4"/><text x="340.0" y="265.0" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">./configure</text><text x="18" y="264" fill="#76d9b4" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Проверки системы</text><path d="M142 259 H228" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M290 281 V293 H169 V310" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M390 281 V293 H511 V310" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="44" y="311" width="250" height="35" rx="8" fill="#