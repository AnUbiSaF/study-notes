<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="957" viewBox="0 0 920 880" role="img">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#738399"/></marker></defs>
<rect width="920" height="880" rx="14" fill="#171b24"/>
<rect x="300" y="20" width="320" height="55" rx="9" fill="#202632" stroke="#7bb4f8" stroke-width="1.5"/>
<text x="460.0" y="42.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#7bb4f8" font-weight="600">Инициализация</text>
<text x="460.0" y="64.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">Stack, Token, status = 0</text>
<path d="M460 75 V98" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="300" y="99" width="320" height="55" rx="9" fill="#202632" stroke="#7bb4f8" stroke-width="1.5"/>
<text x="460.0" y="121.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#7bb4f8" font-weight="600">getchar()</text>
<text x="460.0" y="143.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">Получение символа</text>
<path d="M460 154 V177" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="335" y="178" width="250" height="51" rx="9" fill="#202632" stroke="#7bb4f8" stroke-width="1.5"/>
<text x="460.0" y="209.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#7bb4f8" font-weight="600">c == EOF?</text>
<path d="M335 203 H34 V557 H225" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="56" y="193" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#aab6c8" font-weight="400">Да</text>
<path d="M460 229 V256" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="475" y="246" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#aab6c8" font-weight="400">Нет</text>
<rect x="335" y="257" width="250" height="51" rx="9" fill="#202632" stroke="#b9a2ff" stroke-width="1.5"/>
<text x="460.0" y="288.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#b9a2ff" font-weight="600">isspace(c)?</text>
<path d="M335 282 H230 V340" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="245" y="273" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#aab6c8" font-weight="400">Да</text>
<path d="M585 282 H690 V340" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="670" y="273" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#aab6c8" font-weight="400">Нет</text>
<rect x="88" y="341" width="284" height="100" rx="9" fill="#202632" stroke="#77d8a4" stroke-width="1.5"/>
<text x="230.0" y="364.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#77d8a4" font-weight="600">Если token.len != 0</text>
<text x="230.0" y="386.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">token_append('\0')</text>
<text x="230.0" y="408.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">process_token(...)</text>
<text x="230.0" y="430.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">token.len = 0 при успехе</text>
<rect x="548" y="341" width="284" height="100" rx="9" fill="#202632" stroke="#b9a2ff" stroke-width="1.5"/>
<text x="690.0" y="375.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#b9a2ff" font-weight="600">token_append(&amp;token, c)</text>
<text x="690.0" y="397.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">Добавить символ</text>
<text x="690.0" y="419.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">в буфер</text>
<path d="M230 441 V456 H460 V473" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M690 441 V456 H460 V473" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="335" y="474" width="250" height="48" rx="9" fill="#202632" stroke="#f1c47b" stroke-width="1.5"/>
<text x="460.0" y="504.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#f1c47b" font-weight="600">status != 0?</text>
<path d="M585 498 H882 V126 H620" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="795" y="488" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#aab6c8" font-weight="400">Нет: читать дальше</text>
<path d="M460 522 V538" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="474" y="534" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#f29b9b" font-weight="400">Да: break</text>
<rect x="225" y="539" width="470" height="67" rx="9" fill="#202632" stroke="#7bb4f8" stroke-width="1.5"/>
<text x="460.0" y="567.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#7bb4f8" font-weight="600">После цикла</text>
<text x="460.0" y="589.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">Если status == 0 и token.len != 0: обработать остаток</text>
<path d="M460 606 V627" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="225" y="628" width="470" height="56" rx="9" fill="#202632" stroke="#f1c47b" stroke-width="1.5"/>
<text x="460.0" y="651.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#f1c47b" font-weight="600">Проверка стека</text>
<text x="460.0" y="673.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">Если status == 0 и stack.size != 1 → status = 5</text>
<path d="M460 684 V705" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="225" y="706" width="470" height="56" rx="9" fill="#202632" stroke="#77d8a4" stroke-width="1.5"/>
<text x="460.0" y="729.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#77d8a4" font-weight="600">Вывод</text>
<text x="460.0" y="751.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">Только при status == 0: unbox_int → printf</text>
<path d="M460 762 V783" fill="none" stroke="#738399" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="225" y="784" width="470" height="70" rx="9" fill="#202632" stroke="#7bb4f8" stroke-width="1.5"/>
<text x="460.0" y="803.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#7bb4f8" font-weight="600">Общее завершение</text>
<text x="460.0" y="825.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">free(stack.data); free(token.data);</text>
<text x="460.0" y="847.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#e4e9f2" font-weight="400">return status;</text>
</svg>