<text x="339" y="187" text-anchor="end" font-size="20" class="label">ба$</text>
<text x="478" y="133" text-anchor="middle" font-size="20" class="label">$</text>
<text x="71" y="241" text-anchor="middle" font-size="20" class="label">ба$</text>
<text x="201" y="247" text-anchor="middle" font-size="20" class="label">$</text>
