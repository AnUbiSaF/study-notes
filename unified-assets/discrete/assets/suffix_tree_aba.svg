<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 415" role="img" aria-label="Сжатое суффиксное дерево строки аба доллар с позициями суффиксов">
<style>
text { font-family: system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif; fill: #d2dbe8; }
