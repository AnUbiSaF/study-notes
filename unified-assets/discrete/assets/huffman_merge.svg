<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 290" role="img" aria-label="Объединение двух наиболее редких символов в один узел дерева Хаффмана">
<style>
text { font-family: system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif; fill: #d2dbe8; }
line,path { stroke: #8491a4; }
.label { fill: #71ddc4; font-weight: 650; }
.sub { font-size: 15px; fill: #aab8cb; }
.node { fill: #6486a4; }
.leaf { fill: #217c70; }
.white, .white text { fill: white; font-weight: 600; }
@media (prefers-color-scheme: light) {
  text { fill: #455167; }
  line,path { stroke: #7b899c; }
  .label { fill: #16816f; }
  .sub { fill: #5f6d7f; }
}
</style>
<text x="20" y="31" font-size="19" font-weight="700">До объединения</text>
<text x="380" y="31" font-size="19" font-weight="700">После объединения</text>
<!-- unmerged -->
<path d="M158 70 L94 151 M158 70 L223 151" stroke-width="2.4" fill="none"/>
<rect x="92" y="48" width="132" height="42" rx="12" fill="#426d90"/>
<text x="158" y="74" text-anchor="middle" class="white" font-size="17">p′ = 0,3</text>
<rect x="28" y="150" width="131" height="46" rx="12" class="leaf"/>
<rect x="163" y="150" width="131" height="46" rx="12" class="leaf"/>
<text x="93" y="178" class="white" text-anchor="middle" font-size="17">pₙ₋₁ = 0,2</text>
<text x="229" y="178" class="white" text-anchor="middle" font-size="17">pₙ = 0,1</text>
<text x="104" y="125" class="label" text-anchor="middle" font-size="17">0</text>
<text x="211" y="125" class="label" text-anchor="middle" font-size="17">1</text>
<!-- arrow -->
<path d="M318 131 L361 131" stroke-width="2.8" fill="none"/>
<path d="M350 123 L361 131 L350 139" stroke-width="2.8" fill="none"/>
<!-- merged -->
<rect x="404" y="105" width="197" height="53" rx="13" fill="#426d90"/>
<text x="503" y="137" class="white" text-anchor="middle" font-size="19">p′ = 0,2 + 0,1</text>
<text x="158" y="230" font-size="17" text-anchor="middle" class="sub">Два листа глубже на 1</text>
<text x="503" y="230" font-size="17" text-anchor="middle" class="sub">Один объединённый символ</text>
<text x="325" y="269" font-size="17" text-anchor="middle">При разделении средняя длина увеличится на p′ = 0,3</text>
</svg>