<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390" role="img" aria-labelledby="title desc">
  <title id="title">Замкнутый параллелепипед в R в квадрате</title>
  <desc id="desc">Прямоугольник с нижней точкой a, верхней точкой b и внутренней точкой x; показаны покоординатные ограничения.</desc>
  <style>
    .axis { stroke: #334155; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .box { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
    .point { fill: #0f172a; }
    .accent { fill: #dc2626; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; font-size: 19px; }
    .small { font-size: 17px; fill: #334155; }
    .formula { font-family: "Times New Roman", serif; font-style: italic; font-size: 22px; }
  </style>

  <rect width="620" height="390" fill="white"/>
  <line class="axis" x1="65" y1="315" x2="555" y2="315"/>
  <path fill="#334155" d="M555 315 l-12 -7 v14 z"/>
  <line class="axis" x1="65" y1="315" x2="65" y2="45"/>
  <path fill="#334155" d="M65 45 l-7 12 h14 z"/>
  <text x="563" y="322" class="formula">x₁</text>
  <text x="48" y="38" class="formula">x₂</text>

  <rect class="box" x="145" y="105" width="300" height="155" rx="2"/>
  <line class="guide" x1="145" y1="260" x2="145" y2="315"/>
  <line class="guide" x1="445" y1="260" x2="445" y2="315"/>
  <line class="guide" x1="65" y1="260" x2="145" y2="260"/>
  <line class="guide" x1="65" y1="105" x2="145" y2="105"/>

  <circle class="point" cx="145" cy="260" r="5.5"/>
  <circle class="point" cx="445" cy="105" r="5.5"/>
  <circle class="accent" cx="310" cy="175" r="6"/>
  <line class="guide" x1="310" y1="175" x2="310" y2="315"/>
  <line class="guide" x1="65" y1="175" x2="310" y2="175"/>

  <text x="112" y="285" class="formula">a=(a₁,a₂)</text>
  <text x="454" y="98" class="formula">b=(b₁,b₂)</text>
  <text x="320" y="168" class="formula">x=(x₁,x₂)</text>
  <text x="126" y="342" class="formula">a₁</text>
  <text x="432" y="342" class="formula">b₁</text>
  <text x="25" y="266" class="formula">a₂</text>
  <text x="25" y="112" class="formula">b₂</text>
  <text x="292" y="342" class="formula">x₁</text>
  <text x="25" y="181" class="formula">x₂</text>

  <text x="145" y="370" class="small">a₁ ≤ x₁ ≤ b₁</text>
  <text x="355" y="370" class="small">a₂ ≤ x₂ ≤ b₂</text>
</svg>
