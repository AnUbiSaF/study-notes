<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" role="img" aria-label="На уровне T равном 3 из восьми позиций A занимает четыре B две C одну и одна свободна">
<style>text{font-family:Arial,sans-serif;fill:#dce7f1;font-size:19px}.muted{fill:#afbecc;font-size:17px}.a{fill:#187d73}.b{fill:#966c35}.c{fill:#6269a8}.free{fill:#273544;stroke:#8092a6;stroke-width:2;stroke-dasharray:6 5}</style>
<text x="20" y="32" font-size="22" font-weight="bold">Считаем занятые позиции на общем уровне T = 3</text>
<text class="muted" x="20" y="71">У любого полного двоичного дерева на этом уровне 2³ = 8 позиций.</text>
<g transform="translate(20,95)">
<rect class="a" x="0" y="0" width="100" height="74" rx="7"/><rect class="a" x="104" y="0" width="100" height="74" rx="7"/><rect class="a" x="208" y="0" width="100" height="74" rx="7"/><rect class="a" x="312" y="0" width="100" height="74" rx="7"/>
<rect class="b" x="416" y="0" width="100" height="74" rx="7"/><rect class="b" x="520" y="0" width="100" height="74" rx="7"/>
<rect class="c" x="624" y="0" width="100" height="74" rx="7"/><rect class="free" x="728" y="0" width="100" height="74" rx="7"/>
<text x="44" y="43">A</text><text x="148" y="43">A</text><text x="252" y="43">A</text><text x="356" y="43">A</text><text x="460" y="43">B</text><text x="564" y="43">B</text><text x="668" y="43">C</text><text x="764" y="43">—</text>
</g>
<text class="muted" x="20" y="202">A: 2³⁻¹ = 4 позиции; B: 2³⁻² = 2; C: 2³⁻³ = 1.</text>
<text x="20" y="236">Занято 7 из 8 → 1 свободная → 1/2 + 1/4 + 1/8 = 7/8 &lt; 1.</text>
</svg>