<style>.bg{fill:#151515}.edge{stroke:#ddd;stroke-width:3;fill:none}.x{stroke:#6f86c8;stroke-width:4}.y{stroke:#70b07b;stroke-width:4}.d1{stroke:#d36a55;stroke-width:4}.d2{stroke:#b579d6;stroke-width:4}.o{fill:#f4b942}.lab{fill:#eee;font:600 24px Arial}.sm{fill:#ccc;font:500 18px Arial}.fm{fill:#e7e7e7;font:500 21px serif}</style>
