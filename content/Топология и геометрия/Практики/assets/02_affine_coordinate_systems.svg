<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760">
<style>
.bg{fill:#151515}.edge{stroke:#d8d8d8;stroke-width:3;fill:none}.axis1{stroke:#6f86c8;stroke-width:4;fill:none}.axis2{stroke:#70b07b;stroke-width:4;fill:none}
.pt{fill:#f0f0f0}.mpt{fill:#d36a55}.label{fill:#ececec;font:600 24px Arial}.small{fill:#c8c8c8;font:500 19px Arial}.formula{fill:#e2e2e2;font:500 21px serif}
.box{fill:#202020;stroke:#555;stroke-width:2}
</style>
<rect class="bg" width="1250" height="760"/>
<text class="label" x="45" y="48">Задача 2. Две аффинные системы координат</text>
<path class="edge" d="M90 610 L520 610 L330 120 Z"/>
<circle class="pt" cx="90" cy="610" r="6"/><text class="label" x="58" y="646">A</text>
<circle class="pt" cx="520" cy="610" r="6"/><text class="label" x="530" y="646">B</text>
<circle class="pt" cx="330" cy="120" r="6"/><text class="label" x="322" y="92">C</text>
<line class="axis1" x1="90" y1="610" x2="505" y2="610"/><line class="axis2" x1="90" y1="610" x2="325" y2="133"/>
<text class="small" x="235" y="645">AB</text><text class="small" x="165" y="355">AC</text>
<circle class="pt" cx="210" cy="365" r="6"/><text class="small" x="166" y="361">B′</text>
<circle class="pt" cx="305" cy="610" r="6"/><text class="small" x="294" y="642">C′</text>
<circle class="mpt" cx="313.3" cy="446.7" r="8"/><text class="label" x="326" y="442">M</text>
<line class="axis1" x1="313.3" y1="446.7" x2="214" y2="367"/><line class="axis2" x1="313.3" y1="446.7" x2="302" y2="596"/>
<text class="small" x="232" y="398">MB′</text><text class="small" x="326" y="535">MC′</text>
<rect class="box" x="650" y="95" width="520" height="255" rx="14"/>
<text class="label" x="680" y="135">Система ABC</text>
<text class="formula" x="680" y="178">A — начало, AB и AC — базис</text>
<text class="formula" x="680" y="220">M = (1/3, 1/3)</text>
<text class="formula" x="680" y="260">B′ = (0, 1/2)</text>
<text class="formula" x="680" y="300">C′ = (1/2, 0)</text>
<rect class="box" x="650" y="390" width="520" height="255" rx="14"/>
<text class="label" x="680" y="430">Система MB′C′</text>
<text class="formula" x="680" y="473">M — начало, MB′ и MC′ — базис</text>
<text class="formula" x="680" y="515">M = (0, 0)</text>
<text class="formula" x="680" y="555">B′ = (1, 0)</text>
<text class="formula" x="680" y="595">C′ = (0, 1)</text>
<text class="small" x="650" y="700">Точка одна и та же; меняются только её координаты.</text>
</svg>