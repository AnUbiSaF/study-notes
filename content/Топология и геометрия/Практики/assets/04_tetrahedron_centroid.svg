  <circle class="point" cx="435" cy="105" r="9"/><text class="label" x="448" y="101">D</text>
  <circle class="point" cx="705" cy="370" r="9"/><text class="label" x="720" y="376">C</text>
  <circle class="point" cx="425" cy="430" r="9"/><text class="label" x="438" y="456">B</text>
  <circle class="minor" cx="530" cy="302" r="9"/><text class="label" x="543" y="296">A₁</text>
  <circle class="minor" cx="323" cy="267" r="9"/><text class="label" x="275" y="258">B₁</text>
  <circle class="minor" cx="410" cy="353" r="10"/><text class="label" x="423" y="348">M</text>
  <text class="note" x="42" y="482">M делит каждую медиану в отношении 3:1 от вершины.</text>
