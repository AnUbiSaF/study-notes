<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="520" viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.t{font:600 25px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#e8e8e8}
.s{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#c5c5c5}
.a{stroke:#7894df;stroke-width:4;fill:none}.g{stroke:#76b77b;stroke-width:4;fill:none}
.dot{fill:#ededed}.box{fill:#151515;stroke:#424242;stroke-width:1.5}
</style>
<marker id="arrA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7894df"/></marker>
<marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#76b77b"/></marker>
</defs>
<text class="t" x="40" y="42">Связанный и свободный вектор</text>
<rect class="box" x="45" y="75" width="300" height="330" rx="14"/>
<text class="t" x="75" y="115">Связанный</text>
<circle class="dot" cx="105" cy="260" r="7"/><circle class="dot" cx="275" cy="175" r="7"/>
<line class="a" x1="105" y1="260" x2="275" y2="175" marker-end="url(#arrA)"/>
<text class="s" x="88" y="290">X</text><text class="s" x="285" y="170">Y</text>
<text class="s" x="75" y="340">[XY⟩ — одна конкретная</text><text class="s" x="75" y="365">стрелка с началом X</text>

<rect class="box" x="395" y="75" width="310" height="330" rx="14"/>
<text class="t" x="425" y="115">Свободный</text>
<line class="g" x1="445" y1="185" x2="575" y2="120" marker-end="url(#arrG)"/>
<line class="g" x1="485" y1="270" x2="615" y2="205" marker-end="url(#arrG)"/>
<line class="g" x1="525" y1="355" x2="655" y2="290" marker-end="url(#arrG)"/>
<text class="s" x="425" y="385">[[XY⟩]~ — класс всех</text><text class="s" x="425" y="410">эквивалентных стрелок</text>

<rect class="box" x="755" y="75" width="300" height="330" rx="14"/>
<text class="t" x="785" y="115">Изоморфизм</text>
<text class="s" x="785" y="160">ψₓ : V → Vₓ</text>
<text class="s" x="785" y="195">Берём свободный вектор</text><text class="s" x="785" y="222">и прикладываем его к X.</text>
<circle class="dot" cx="805" cy="315" r="7"/>
<line class="a" x1="805" y1="315" x2="965" y2="235" marker-end="url(#arrA)"/>
<text class="s" x="788" y="346">X</text><text class="s" x="785" y="385">V ≅ Vₓ</text>
<text class="s" x="40" y="475">Связанный вектор хранит точку приложения, свободный — только само перемещение.</text>
</svg>