<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 379" width="960" height="379" role="img" aria-label="Динамический массив: size и capacity"><title>Динамический массив: size и capacity</title><desc>При заполнении динамического массива вместимость увеличивается, например с 4 до 8.</desc><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#46D3BE"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#F3C36C"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#90B9F8"/></marker></defs><rect x="0" y="0" width="960" height="379" rx="18" fill="#121B2A"/><text x="48" y="43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" fill="#E8F0F8" text-anchor="start">Vector: занятые элементы ≠ вместимость</text><text x="49" y="104" font-family="'DejaVu Sans',Arial,sans-serif" font-size="18" font-weight="600" fill="#E8F0F8" text-anchor="start">До добавления</text><text x="49" y="135" font-family="'DejaVu Sans Mono',monospace" font-size="18" font-weight="600" fill="#46D3BE" text-anchor="start">size = 4</text><text x="49" y="164" font-family="'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" fill="#B5C4D5" text-anchor="start">capacity = 4</text><rect x="284" y="99" width="104" height="66" rx="8" fill="#183F41" stroke="#46D3BE" stroke-width="1.7"/><text x="336" y="137" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#E8F0F8" text-anchor="middle">a</text><rect x="419" y="99" width="104" height="66" rx="8" fill="#183F41" stroke="#46D3BE" stroke-width="1.7"/><text x="471" y="137" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#E8F0F8" text-anchor="middle">b</text><rect x="554" y="99" width="104" height="66" rx="8" fill="#183F41" stroke="#46D3BE" stroke-width="1.7"/><text x="606" y="137" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#E8F0F8" text-anchor="middle">c</text><rect x="689" y="99" width="104" height="66" rx="8" fill="#183F41" stroke="#46D3BE" stroke-width="1.7"/><text x="741" y="137" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#E8F0F8" text-anchor="middle">d</text><path d="M475 179 V208" fill="none" stroke="#46D3BE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="501" y="198" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" fill="#B5C4D5" text-anchor="start">пятый push → увеличение capacity</text><text x="49" y="258" font-family="'DejaVu Sans',Arial,sans-serif" font-size="18" font-weight="600" fill="#E8F0F8" text-anchor="start">После добавления</text><text x="49" y="292" font-family="'DejaVu Sans Mono',monospace" font-size="18" font-weight="600" fill="#46D3BE" text-anchor="start">size = 5</text><text x="49" y="319" font-family="'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" fill="#B5C4D5" text-anchor="start">capacity = 8</text><rect x="284" y="250" width="68" height="57" rx="7" fill="#183F41" stroke="#46D3BE" stroke-width="1.4"/><text x="318" y="285" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="600" fill="#E8F0F8" text-anchor="middle">a</text><rect x="360" y="250" width="68" height="57" rx="7" fill="#183F41" stroke="#46D3BE" stroke-width="1.4"/><text x="394" y="285" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="600" fill="#E8F0F8" text-anchor="middle">b</text><rect x="436" y="250" width="68" height="57" rx="7" fill="#183F41" stroke="#46D3BE" stroke-width="1.4"/><text x="470" y="285" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="600" fill="#E8F0F8" text-anchor="middle">c</text><rect x="512" y="250" width="68" height="57" rx="7" fill="#183F41" stroke="#46D3BE" stroke-width="1.4"/><text x="546" y="285" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="600" fill="#E8F0F8" text-anchor="middle">d</text><rect x="588" y="250" width="68" height="57" rx="7" fill="#183F41" stroke="#46D3BE" stroke-width="1.4"/><text x="622" y="285" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="600" fill="#E8F0F8" text-anchor="middle">e</text><rect x="664" y="250" width="68" height="57" rx="7" fill="#182537" stroke="#62748B" stroke-width="1.4"/><rect x="740" y="250" width="68" height="57" rx="7" fill="#182537" stroke="#62748B" stroke-width="1.4"/><rect x="816" y="250" width="68" height="57" rx="7" fill="#182537" stroke="#62748B" stroke-width="1.4"/><text x="50" y="358" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" fill="#B5C4D5" text-anchor="start">Элементы подряд; realloc может переместить весь буфер.</text></svg>
