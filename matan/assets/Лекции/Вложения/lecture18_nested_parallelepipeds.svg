<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 355" role="img" aria-labelledby="title desc">
  <title id="title">Вложенные параллелепипеды и окрестность их общей точки</title>
  <desc id="desc">На плоскости последовательные прямоугольники P1, P2, P3 и PN вложены друг в друга. Общая точка c находится внутри всех. Малый прямоугольник PN целиком находится внутри пунктирного шара B epsilon от c.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;fill:#e2e8f0}
    .minor{font-size:13px;fill:#cbd5e1}
  </style>
  <rect x="32" y="32" width="512" height="256" rx="0" fill="#648aa4" fill-opacity=".045" stroke="#7e9eb5" stroke-width="2"/>
  <rect x="288" y="32" width="256" height="128" rx="0" fill="#59799e" fill-opacity=".09" stroke="#93adc9" stroke-width="2"/>
  <rect x="288" y="96" width="128" height="64" rx="0" fill="#7d76aa" fill-opacity=".14" stroke="#b1a5d2" stroke-width="2.2"/>
  <circle cx="385" cy="148" r="63" fill="#54aaa7" fill-opacity=".07" stroke="#75d1c5" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="352" y="128" width="64" height="32" rx="0" fill="#eab866" fill-opacity=".18" stroke="#e9c789" stroke-width="2.5"/>
  <circle cx="385" cy="148" r="4.5" fill="#ffda8a" />
  <text x="44" y="274">P1</text>
  <text x="511" y="52" text-anchor="end">P2</text>
  <text x="297" y="115">P3</text>
  <text x="354" y="124">P_N</text>
  <text x="392" y="144">c</text>
  <text x="462" y="91" fill="#75d1c5">Bε(c)</text>
  <path d="M456 98 L428 114" stroke="#75d1c5" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <text class="minor" x="32" y="324">Схема для R^2; рассуждение работает в R^m.</text>
</svg>
