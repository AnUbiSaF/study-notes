<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="560" viewBox="0 0 1450 560" role="img" aria-label="Поток управления: предусловие, постусловие и switch">
 <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9bb2c9"/></marker></defs><style>
.title { font-size:27px; font-weight:700; font-family:Arial,DejaVu Sans,sans-serif; fill:#e9f1fb }
.heading { font-size:19px; font-weight:700; font-family:Arial,DejaVu Sans,sans-serif; fill:#dbe9fa }
.txt { font-size:17px; font-weight:500; font-family:Arial,DejaVu Sans,sans-serif; fill:#d1dbe8 }
.small { font-size:15px; font-weight:400; font-family:Arial,DejaVu Sans,sans-serif; fill:#adbdce }
.mono { font-size:16px; font-weight:500; font-family:DejaVu Sans Mono,Consolas,monospace; fill:#d8e6f8 }
.block { fill:#1c2d43; stroke:#6d8ba9; stroke-width:1.6 }
.block2 { fill:#172e37; stroke:#508f98; stroke-width:1.6 }
.block3 { fill:#302a3e; stroke:#8d77ad; stroke-width:1.6 }
.arrow { stroke:#9bb2c9; stroke-width:2.3; fill:none; marker-end:url(#arrowhead) }
.dash { stroke:#a4b5c7; stroke-width:1.8; fill:none; stroke-dasharray:6 6 }
@media (prefers-color-scheme:light) {
  .title,.heading { fill:#203247 }
  .txt,.mono { fill:#24374b }
  .small { fill:#4e6075 }
  .block { fill:#eef4fb; stroke:#7b98af }
  .block2 { fill:#eaf7f4; stroke:#5d9a91 }
  .block3 { fill:#f1edf8; stroke:#9381aa }
  .arrow { stroke:#657e97 }
  .dash { stroke:#74869a }
}
</style><text x="28" y="39" class="title">Поток управления: предусловие, постусловие и switch</text><text x="160" y="80" text-anchor="middle" class="heading">while</text><text x="623" y="80" text-anchor="middle" class="heading">do ... while</text><text x="1110" y="80" text-anchor="middle" class="heading">switch</text><rect x="80" y="115" width="180" height="70" rx="13" class="block"/><text x="170.0" y="155.0" text-anchor="middle" class="txt">Условие ?</text><rect x="80" y="280" width="180" height="70" rx="13" class="block2"/><text x="170.0" y="320.0" text-anchor="middle" class="txt">Тело цикла</text><rect x="80" y="430" width="180" height="58" rx="13" class="block3"/><text x="170.0" y="464.0" text-anchor="middle" class="txt">Выход</text><path d="M 170 185 V 279" class="arrow"/><text x="188" y="232" text-anchor="start" class="small">истина</text><path d="M 80 316 H 38 V 150 H 79" class="arrow"/><path d="M 260 151 H 312 V 458 H 261" class="arrow"/><text x="312" y="183" text-anchor="start" class="small">ложь</text><rect x="530" y="115" width="184" height="70" rx="13" class="block2"/><text x="622.0" y="155.0" text-anchor="middle" class="txt">Тело цикла</text><rect x="530" y="280" width="184" height="70" rx="13" class="block"/><text x="622.0" y="320.0" text-anchor="middle" class="txt">Условие ?</text><rect x="530" y="430" width="184" height="58" rx="13" class="block3"/><text x="622.0" y="464.0" text-anchor="middle" class="txt">Выход</text><path d="M 622 185 V 279" class="arrow"/><path d="M 530 316 H 475 V 151 H 529" class="arrow"/><text x="483" y="306" text-anchor="start" class="small">истина</text><path d="M 622 350 V 429" class="arrow"/><text x="639" y="390" text-anchor="start" class="small">ложь</text><rect x="1010" y="115" width="200" height="70" rx="13" class="block"/><text x="1110.0" y="155.0" text-anchor="middle" class="txt">switch(x)</text><rect x="1010" y="235" width="200" height="63" rx="13" class="block2"/><text x="1110.0" y="271.5" text-anchor="middle" class="txt">case 1: ...</text><rect x="1010" y="353" width="200" height="63" rx="13" class="block2"/><text x="1110.0" y="389.5" text-anchor="middle" class="txt">case 2: ...</text><rect x="1242" y="350" width="170" height="63" rx="13" class="block3"/><text x="1327.0" y="386.5" text-anchor="middle" class="txt">Выход</text><path d="M 1110 185 V 234" class="arrow"/><path d="M 1010 150 H 968 V 385 H 1009" class="arrow"/><path d="M 1110 299 V 352" class="arrow"/><text x="1128" y="329" text-anchor="start" class="small">без break</text><path d="M 1210 384 H 1241" class="arrow"/><text x="1236" y="335" text-anchor="middle" class="small">break</text><text x="1250" y="232" text-anchor="start" class="small">default и другие case</text><text x="1250" y="253" text-anchor="start" class="small">выбираются по x</text><text x="24" y="532" text-anchor="start" class="small">* switch передаёт управление внутрь блока по метке; без break выполнение продолжается через следующие case.</text></svg>

