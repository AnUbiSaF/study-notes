<text x="564" y="301" font-size="16" fill="#62C3AE" text-anchor="start" font-weight="400" class="">4. А = А: записать «А»</text>
<text x="564" y="346" font-size="16" fill="#D8A966" text-anchor="start" font-weight="700" class="">«БА» → перевернуть → «АБ»</text>
