<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 225" role="img" aria-label="Объект Person содержит имя, Address и Contact">
  <rect width="640" height="225" rx="12" fill="#172334"/>
  <rect x="18" y="18" width="604" height="189" rx="10" fill="#25344a" stroke="#90a9c7" stroke-width="2"/>
  <text x="320" y="45" font-size="22" font-family="Arial,sans-serif" font-weight="bold" fill="#f0f5fb" text-anchor="middle">Person</text>
  <path d="M18 57H622" stroke="#90a9c7"/>
  <rect x="34" y="78" width="165" height="92" rx="8" fill="#304761" stroke="#a3bcdd"/>
  <text x="116" y="110" font-family="Arial,sans-serif" font-size="18" fill="#f0f5fb" text-anchor="middle">name_</text>
  <text x="116" y="138" font-family="Arial,sans-serif" font-size="15" fill="#d6e1ef" text-anchor="middle">std::string</text>
  <rect x="224" y="78" width="180" height="92" rx="8" fill="#23433c" stroke="#76bda4"/>
  <text x="314" y="106" font-family="Arial,sans-serif" font-size="18" fill="#f0f9f4" text-anchor="middle">Address addr_</text>
  <text x="314" y="132" font-family="Arial,sans-serif" font-size="15" fill="#c4eadb" text-anchor="middle">city_, street_</text>
  <text x="314" y="152" font-family="Arial,sans-serif" font-size="15" fill="#c4eadb" text-anchor="middle">number_</text>
  <rect x="429" y="78" width="177" height="92" rx="8" fill="#23433c" stroke="#76bda4"/>
  <text x="517" y="106" font-family="Arial,sans-serif" font-size="18" fill="#f0f9f4" text-anchor="middle">Contact contact_</text>
  <text x="517" y="134" font-family="Arial,sans-serif" font-size="15" fill="#c4eadb" text-anchor="middle">phone_, email_</text>
  <text x="320" y="192" font-family="Arial,sans-serif" font-size="14" fill="#c7d6e8" text-anchor="middle">Поля-объекты живут внутри Person и создаются в порядке объявления</text>
</svg>
