<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760">
<style>
.bg{fill:#151515}.edge{stroke:#d8d8d8;stroke-width:3;fill:none}
.pq{stroke:#6f86c8;stroke-width:4;fill:none}.ab{stroke:#d36a55;stroke-width:4;fill:none}
.pt{fill:#f0f0f0}.lab{fill:#ececec;font:600 24px Arial}.sm{fill:#c8c8c8;font:500 18px Arial}
.fm{fill:#e2e2e2;font:500 21px serif}.box{fill:#202020;stroke:#555;stroke-width:2}
</style>
<rect class="bg" width="1260" height="760"/>
<text class="lab" x="45" y="50">Задача 2. Площадь треугольника через det 2×2 и det 3×3</text>

<!-- left geometry -->
<text class="sm" x="55" y="95">Радиус-векторы: a = OA, b = OB, c = OC</text>
<circle class="pt" cx="100" cy="580" r="6"/><text class="lab" x="70" y="620">O</text>
<line class="pq" x1="100" y1="580" x2="330" y2="580"/>
<line class="pq" x1="100" y1="580" x2="210" y2="340"/>
<text class="sm" x="210" y="610">p</text><text class="sm" x="170" y="435">q</text>

<!-- triangle points -->
<circle class="pt" cx="260" cy="500" r="6"/><text class="lab" x="238" y="490">A</text>
<circle class="pt" cx="420" cy="430" r="6"/><text class="lab" x="430" y="425">B</text>
<circle class="pt" cx="300" cy="230" r="6"/><text class="lab" x="305" y="220">C</text>
<path class="edge" d="M260 500 L420 430 L300 230 Z"/>

<line class="ab" x1="260" y1="500" x2="420" y2="430"/>
<line class="ab" x1="260" y1="500" x2="300" y2="230"/>
<text class="sm" x="335" y="485">AB = b − a</text>
<text class="sm" x="185" y="360">AC = c − a</text>

<rect class="box" x="520" y="100" width="690" height="230" rx="14"/>
<text class="lab" x="550" y="140">Сначала: обычный определитель 2×2</text>
<text class="fm" x="550" y="190">AB = (λ₂−λ₁)p + (μ₂−μ₁)q</text>
<text class="fm" x="550" y="230">AC = (λ₃−λ₁)p + (μ₃−μ₁)q</text>
<text class="fm" x="550" y="282">det₂ = | λ₂−λ₁   λ₃−λ₁ ;  μ₂−μ₁   μ₃−μ₁ |</text>

<rect class="box" x="520" y="370" width="690" height="280" rx="14"/>
<text class="lab" x="550" y="410">Потом преподаватель сравнил с det 3×3</text>
<text class="fm" x="550" y="458">| λ₁  λ₂  λ₃ |</text>
<text class="fm" x="550" y="493">| μ₁  μ₂  μ₃ |</text>
<text class="fm" x="550" y="528">|  1   1   1 |</text>
<text class="sm" x="780" y="490">C₂ ← C₂ − C₁</text>
<text class="sm" x="780" y="522">C₃ ← C₃ − C₁</text>
<text class="fm" x="550" y="585">→ нижняя строка становится (1, 0, 0)</text>
<text class="fm" x="550" y="620">→ остаётся ровно тот же det 2×2</text>

<text class="sm" x="55" y="700">Важно: det 3×3 здесь не про объём. Это компактная запись того же коэффициента площади.</text>
</svg>