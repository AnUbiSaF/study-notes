<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="100%" height="100%" fill="#111827"/>
<style>.t{font-family:Arial,sans-serif;fill:#f3f4f6}.h{font-size:30px;font-weight:700}.l{font-size:21px}.edge1{stroke:#60a5fa;stroke-width:3;fill:none}.edge2{stroke:#34d399;stroke-width:3;fill:none}.dash{stroke-dasharray:8 8}.pt{fill:#fbbf24}.m{fill:#f87171}</style>
