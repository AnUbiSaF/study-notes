<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Схема Уолкера — интерактив</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#111821;color:#e9eef6}*{box-sizing:border-box}body{margin:0;padding:14px}.panel{max-width:780px;margin:auto;background:#1b2634;border:1px solid #364658;border-radius:16px;padding:20px}h2{font-size:20px;margin:0 0 8px}.hint{color:#acbccc;font-size:13px}label{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}input{width:100%;accent-color:#49c6cc}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0}.cell{background:#121d2b;border:1px solid #455569;border-radius:9px;padding:7px}.cell.active{border-color:#59c7d2;box-shadow:0 0 0 1px #59c7d2}.cell small{display:block;text-align:center;color:#a6b7c9;margin-bottom:8px}.bar{display:flex;height:58px;border-radius:6px;overflow:hidden}.part{display:grid;place-items:center;font-size:14px;font-weight:700;color:white;min-width:0}.A{background:#229688}.B{background:#c08a3d}.C{background:#9560b1}.D{background:#667ed2}.pointer{position:relative;height:20px}.pointer:after{content:'▼';color:#ffe297;position:absolute;left:var(--x,-50%);top:0;transform:translateX(-50%);font-size:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#111b27;border:1px solid #364354;border-radius:9px;text-align:center;padding:12px 4px}.stat span{display:block;font-size:12px;color:#abc0d0}.stat strong{font-size:22px}.result{background:#14303b;border:1px solid #376577;padding:13px;margin-top:12px;text-align:center;border-radius:10px}.result strong{font-size:30px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px;flex-wrap:wrap}button{background:#2b5466;color:white;border:1px solid #507b8e;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}button:hover{background:#397085}@media(max-width:500px){.panel{padding:12px}.grid{gap:4px}.cell{padding:3px}.bar{height:45px}.stats{gap:5px}.stat strong{font-size:17px}}
</style></head><body><main class="panel"><h2>Схема Уолкера</h2><div class="hint">Вероятности: A — 5%, B — 34%, C — 29%, D — 32%</div><label for="u"><span>Случайное число U</span><strong id="uText">0,370</strong></label><input id="u" type="range" min="0" max="0.999" step="0.001" value="0.37"><div id="grid" class="grid"></div><div class="stats"><div class="stat"><span>4 × U</span><strong id="scaled"></strong></div><div class="stat"><span>Ячейка</span><strong id="cell"></strong></div><div class="stat"><span>Дробная часть</span><strong id="frac"></strong></div></div><div class="result"><div class="hint" id="rule"></div><strong id="result"></strong></div><div class="row"><span class="hint">Целая часть выбирает ячейку, дробная — исход.</span><button id="random">Случайный выбор ↻</button></div></main><script>
const cells=[[['A',.20],['B',.80]],[['B',.56],['D',.44]],[['D',.84],['C',.16]],[['C',1]]],grid=document.getElementById('grid'),slider=document.getElementById('u'),f=x=>x.toFixed(3).replace('.',',');cells.forEach((parts,i)=>{const wrap=document.createElement('div');wrap.className='cell';const header=document.createElement('small');header.textContent='Ячейка '+(i+1);wrap.appendChild(header);const bar=document.createElement('div');bar.className='bar';for(const [name,size] of parts){const p=document.createElement('div');p.className='part '+name;p.style.width=(size*100)+'%';p.textContent=name;bar.appendChild(p)}wrap.appendChild(bar);const pointer=document.createElement('div');pointer.className='pointer';wrap.appendChild(pointer);grid.appendChild(wrap)});function update(){const u=+slider.value,y=4*u,i=Math.min(3,Math.floor(y)),r=y-i,t=cells[i][0][1],choice=r<t?cells[i][0][0]:(cells[i][1]||cells[i][0])[0];document.getElementById('uText').textContent=f(u);document.getElementById('scaled').textContent=f(y);document.getElementById('cell').textContent=i+1;document.getElementById('frac').textContent=f(r);document.getElementById('rule').textContent=f(r)+(r<t?' < ':' ≥ ')+f(t);document.getElementById('result').textContent=choice;[...grid.children].forEach((el,j)=>{el.classList.toggle('active',i===j);el.querySelector('.pointer').style.setProperty('--x',i===j?(r*100)+'%':'-50%')})}slider.addEventListener('input',update);document.getElementById('random').addEventListener('click',()=>{slider.value=(Math.random()*.999).toFixed(3);update()});update();
</script></body></html>
