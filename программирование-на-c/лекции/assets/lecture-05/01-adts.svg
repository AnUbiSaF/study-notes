<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" width="960" height="552" role="img" aria-label="АТД: интерфейс, контракт, реализация"><title>АТД: интерфейс, контракт, реализация</title><desc>Абстрактный тип данных состоит из интерфейса и контракта; предусловия, постусловия и инварианты входят в контракт.</desc><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#46D3BE"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#F3C36C"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#90B9F8"/></marker></defs><rect x="0" y="0" width="960" height="552" rx="18" fill="#121B2A"/><text x="480" y="42" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="700" fill="#E8F0F8" text-anchor="middle">АТД — что обещано, структура данных — как устроено</text><rect x="215" y="60" width="530" height="74" rx="12" fill="#173C43" stroke="#46D3BE" stroke-width="2"/><text x="480" y="91" font-family="'DejaVu Sans',Arial,sans-serif" font-size="25" font-weight="700" fill="#E8F0F8" text-anchor="middle">АТД: стек (Stack)</text><text x="480" y="116" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" fill="#B5C4D5" text-anchor="middle">интерфейс + контракт</text><path d="M480 134 V154 H245 V170" fill="none" stroke="#46D3BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 154 H715 V170" fill="none" stroke="#46D3BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="170" width="405" height="210" rx="12" fill="#1C2A3D" stroke="#62748B" stroke-width="1.8"/><text x="244" y="202" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="700" fill="#E8F0F8" text-anchor="middle">ИНТЕРФЕЙС</text><text x="244" y="231" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" fill="#B5C4D5" text-anchor="middle">Какие операции доступны</text><path d="M73 246 H414" fill="none" stroke="#62748B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="244" y="285" font-family="'DejaVu Sans Mono',monospace" font-size="22" font-weight="600" fill="#46D3BE" text-anchor="middle">push(s, x)</text><text x="244" y="318" font-family="'DejaVu Sans Mono',monospace" font-size="20" font-weight="500" fill="#E8F0F8" text-anchor="middle">pop(s) · peek(s)</text><text x="244" y="357" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="400" fill="#B5C4D5" text-anchor="middle">сигнатуры операций</text><rect x="513" y="170" width="405" height="210" rx="12" fill="#1C2A3D" stroke="#62748B" stroke-width="1.8"/><text x="716" y="202" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="700" fill="#E8F0F8" text-anchor="middle">КОНТРАКТ</text><text x="716" y="228" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" fill="#B5C4D5" text-anchor="middle">Поведение, требования, гарантии</text><rect x="535" y="245" width="359" height="38" rx="7" fill="#182537" stroke="#3B665F" stroke-width="1"/><text x="553" y="270" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="600" fill="#E8F0F8" text-anchor="start">Предусловие</text><text x="878" y="270" font-family="'DejaVu Sans',Arial,sans-serif" font-size="14" font-weight="400" fill="#B5C4D5" text-anchor="end">до вызова</text><rect x="535" y="289" width="359" height="38" rx="7" fill="#182537" stroke="#3B665F" stroke-width="1"/><text x="553" y="314" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="600" fill="#E8F0F8" text-anchor="start">Постусловие</text><text x="878" y="314" font-family="'DejaVu Sans',Arial,sans-serif" font-size="14" font-weight="400" fill="#B5C4D5" text-anchor="end">после вызова</text><rect x="535" y="333" width="359" height="38" rx="7" fill="#182537" stroke="#3B665F" stroke-width="1"/><text x="553" y="358" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="600" fill="#E8F0F8" text-anchor="start">Инвариант</text><text x="878" y="358" font-family="'DejaVu Sans',Arial,sans-serif" font-size="14" font-weight="400" fill="#B5C4D5" text-anchor="end">всегда</text><path d="M480 380 V415" fill="none" stroke="#46D3BE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="456" y="407" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="400" fill="#B5C4D5" text-anchor="end">реализуется в памяти</text><rect x="165" y="422" width="630" height="45" rx="10" fill="#173C43" stroke="#46D3BE" stroke-width="1.6"/><text x="480" y="452" font-family="'DejaVu Sans',Arial,sans-serif" font-size="19" font-weight="600" fill="#E8F0F8" text-anchor="middle">Реализация АТД на конкретной структуре данных</text><path d="M480 467 V478 H265 V487" fill="none" stroke="#46D3BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 478 H695 V487" fill="none" stroke="#46D3BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="487" width="435" height="50" rx="10" fill="#1C2A3D" stroke="#62748B" stroke-width="1.4"/><text x="264" y="518" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="500" fill="#E8F0F8" text-anchor="middle">Связный список: узлы и next</text><rect x="502" y="487" width="411" height="50" rx="10" fill="#1C2A3D" stroke="#62748B" stroke-width="1.4"/><text x="707" y="518" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="500" fill="#E8F0F8" text-anchor="middle">Динамический массив: data / size</text></svg>
